name: Build Windows Standalone EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python regressions
        run: python -u -m unittest discover -s tests -v
      - name: Frontend regressions
        run: node --test tests/preview_race.test.cjs tests/frontend_release.test.cjs
      - name: Build and assemble distribution
        run: python packaging/build_windows.py --zip-output dist/Windows.zip
      - name: Verify pruned bundle and manifest
        run: |
          python -c "import json, os, pathlib; root = pathlib.Path('dist/Release'); internal = root / 'KindleKPW6Studio/_internal'; assert not (internal / 'pymupdf/layout').exists(); assert not (internal / 'pymupdf/mupdf-devel').exists(); m = json.loads((root / 'RELEASE_MANIFEST.json').read_text(encoding='utf-8')); assert m['base_commit'] == os.environ['GITHUB_SHA'], m; assert not m['working_tree_modified'], m"
      - name: Exercise frozen worker and exports
        run: python packaging/smoke_frozen.py dist/Release/KindleKPW6Studio/KindleKPW6Studio.exe --report build/frozen-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: KindleKPW6Studio-Win64
          path: dist/Windows.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-validation
          path: build/frozen-smoke.json
          if-no-files-found: ignore
