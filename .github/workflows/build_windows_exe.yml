name: Build Windows Standalone EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Regression tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/preview_race.test.cjs tests/frontend_release.test.cjs
      - name: Build and assemble distribution
        run: python packaging/build_windows.py
      - name: Exercise frozen worker and exports
        run: python packaging/smoke_frozen.py dist/Release/KindleKPW6Studio/KindleKPW6Studio.exe --report build/frozen-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: KindleKPW6Studio-Win64
          path: dist/Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-validation
          path: build/frozen-smoke.json
          if-no-files-found: ignore
