name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify repository root layout hygiene
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          root = pathlib.Path('.').resolve()
          allowed_files = {'.gitattributes', '.gitignore', 'CHANGELOG.md', 'LICENSE', 'pyproject.toml', 'README.md'}
          actual_files = {p.name for p in root.iterdir() if p.is_file()}
          extra = actual_files - allowed_files
          assert not extra, f"Unexpected loose files in repository root: {sorted(extra)}"
          assert not list((root / 'docs').glob('*.pdf')), "Generated PDFs must not be tracked in docs/"
          PY
      - name: Worker protocol preflight
        run: python -u tests/worker_protocol_probe.py
      - name: Python unit & integration tests
        run: python -u -c "import faulthandler, runpy; faulthandler.dump_traceback_later(30, repeat=True); runpy.run_module('unittest', run_name='__main__')" discover -s tests -v
      - name: Frontend state machine tests
        run: node --test tests/preview_race.test.cjs tests/frontend_release.test.cjs
